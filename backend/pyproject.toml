[tool.poetry]
name = "rumi-ai-backend"
version = "0.1.0"
description = "Backend and data pipeline for RUMI AI - Persian document processing"
authors = ["RUMI AI Team <team@rumi.ai>"]
license = "MIT"
# Docker/CI/prod install via requirements.txt (pip). Keep runtime deps in sync when both exist.

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.68.0"
uvicorn = {extras = ["standard"], version = "^0.15.0"}
sqlalchemy = "^1.4.22"
psycopg2-binary = "^2.9.11"
pydantic = "^1.8.2"
python-multipart = "^0.0.5"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^0.18.0"
alembic = "^1.7.1"
celery = {extras = ["redis"], version = "^5.1.2"}
requests = "^2.26.0"
Pillow = "^12.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.4"
pytest-cov = "^2.12.1"
black = "^21.7b0"
flake8 = "^3.9.2"
mypy = "^0.910"
isort = "^5.9.3"
pre-commit = "^2.14.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3