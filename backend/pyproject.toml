[tool.poetry]
name = "rumi-ai-backend"
version = "0.1.0"
description = "Backend and data pipeline for RUMI AI - Persian document processing"
authors = ["RUMI AI Team <team@rumi.ai>"]
license = "MIT"
# Docker/CI/prod install via requirements.txt (pip). Keep runtime deps in sync when both exist.

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "0.162.0"
uvicorn = ">=0.20.0"
sqlalchemy = ">=1.4.22,<2.0.0"
psycopg2-binary = "2.9.11"
pydantic = {extras = ["email"], version = ">=2.0.0"}
pydantic-settings = ">=2.0.0"
PyJWT = "2.15.1"
bcrypt = ">=4.0.0"
python-dotenv = ">=1.2.3,<2.0.0"
alembic = ">=1.7.1"
requests = ">=2.26.0"
httpx = ">=0.23.0"
faiss-cpu = ">=1.7.0"
numpy = ">=1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
pytest-cov = "^2.12.1"
black = "26.10.1"
flake8 = "^3.9.2"
mypy = "^0.910"
isort = "^5.9.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3